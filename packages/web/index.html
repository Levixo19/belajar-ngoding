<!-- Lembar gaya yang SAMA dengan antarmuka lama, diproksi ke server Python.
     Menyalinnya ke sini berarti dua lembar gaya untuk satu desain, dan yang
     kedua akan ketinggalan tanpa ada yang menyadarinya. 6.508 baris dan 112
     token desain tidak ditulis ulang. -->

<!-- GSAP 3.15.0 + SplitText, disimpan LOKAL dan dilayani server Python dari
     `webapp/statik/vendor/` (lisensi standar tanpa biaya,
     gsap.com/standard-license; header lisensinya utuh di tiap berkas).
     Tidak ada CDN: aplikasi ini wajib utuh tanpa internet, dan kalau kedua
     berkas ini gagal dimuat `sinema.ts` diam saja -- judulnya sudah ada di
     halaman sejak awal.

     Keduanya WAJIB berdiri di atas modul React, dan tempatnya di sini bukan
     selera: skrip `defer` dan `type="module"` sama-sama dieksekusi menurut
     URUTAN DOKUMEN, sementara `vite build` menempelkan modulnya di KAKI
     <head>. Di kaki <body> -- tempat keduanya mula-mula saya taruh -- GSAP
     jalan SESUDAH bundelnya, dan `gsapSiap()` mengembalikan null untuk
     layar pertama. Itu tidak pernah terlihat sebagai galat: yang terjadi
     cuma judul pertama yang tiba tanpa gerak, sesekali, tergantung mana
     yang lebih dulu selesai antara berkas ini dan permintaan API pertama.

     ScrollTrigger sengaja TIDAK dimuat. Satu-satunya pemakainya
     `beranda.js`, dan modul itu sudah tidak menggerakkan apa pun sejak
     dasbor jadi meja kerja -- memuat 70 KB untuk nol pemanggil adalah
     ongkos yang tidak membeli apa pun. -->
<link rel="stylesheet" href="/gaya.css">
<script defer src="/vendor/gsap/gsap.min.js"></script>
<script defer src="/vendor/gsap/SplitText.min.js"></script>

<!-- Token API TIDAK ditanam di sini, dan itu bukan pilihan gaya.
     `transformIndexHtml` di Vite TIDAK BISA mengubah isi skrip inline: Vite
     mengekstrak badannya sebagai modul lalu menyajikan yang ASLI, jadi
     penggantian di dalam <script> dipulihkan diam-diam. Diukur: pada satu
     rantai `.replace()` yang sama, penanda sebelum tag penutup kepala
     mendarat sementara penggantian di dalam skrip tidak.

     Tag penutup itu DISEBUT, bukan dituliskan, dan itu bukan kerewelan:
     `vite build` menyuntikkan <script src=...> tepat sebelum kecocokan
     PERTAMA teks penutup kepala -- termasuk kecocokan di dalam komentar.
     Terukur: dengan tag itu tertulis di sini, skripnya mendarat DI DALAM
     komentar ini, dan bundel produksinya memuat nol JavaScript. Halamannya
     kosong, tanpa satu pun galat di konsol maupun di keluaran build.
     Jadi plugin `belajar-token` menyuntikkannya lewat `tags`, yang ditempel
     Vite sendiri. Kalau server Python tidak hidup, tag itu tidak ada sama
     sekali -- dan `api.ts` mengatakannya dengan kalimat yang menyebut
     perintahnya, bukan membiarkan 403 yang membingungkan. -->
</head>
<body>
<div id="akar"></div>
<!-- Token untuk produksi. Server Python menggantikan sentinel ini saat
     halaman diminta, persis seperti `{{TOKEN}}` di antarmuka lama -- tokennya
     lahir per JALANNYA server, jadi ia tidak bisa dipanggang ke dalam bundel.

     `|| ` itu wajib, bukan kehati-hatian. Di mode dev plugin `belajar-token`
     menyuntikkan token SUNGGUHAN lewat `head-prepend`, jadi ia jalan LEBIH
     DULU; baris ini jalan sesudahnya dan tanpa `||` ia akan menimpa token
     yang benar dengan sentinelnya -- dan `api.ts` memperlakukan sentinel
     sebagai "tidak ada token", jadi seluruh API menjawab 403 di mode dev. -->
<script>window.TOKEN_BELAJAR = window.TOKEN_BELAJAR || "__TOKEN_BELAJAR__";</script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
